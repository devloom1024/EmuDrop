name: release

# Builds an installable EmuDrop package for the TrimUI Brick Pro (StockOS /
# CrossMix) and attaches it to the GitHub release.
#
# The build runs inside tools/toolchain (Debian bullseye, glibc 2.31) because
# the GitHub arm64 runner itself is Ubuntu 24.04 (glibc 2.39) and binaries built
# there would not start on TrimUI firmware (glibc 2.33).

on:
  push:
    tags:
      - "v3.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to build the changelog

      - name: Show build version
        run: |
          echo "VERSION file: $(cat VERSION)"
          docker version --format '{{.Server.Version}}'
          python3 --version

      - name: Build package (bullseye container, glibc 2.31)
        run: |
          make -C tools/toolchain release \
            DEVICE="Trimui Brick Pro" \
            TARGET_OS=StockOS

      - name: Verify package
        run: |
          test -x dist/EmuDrop/EmuDrop
          cat dist/EmuDrop/version.txt
          ls -l dist/EmuDrop

      - name: Package
        run: |
          # The toolchain container runs as root, so dist/ is not writable here
          sudo chown -R "$(id -u):$(id -g)" dist
          ASSET="EmuDrop-${GITHUB_REF_NAME:-dev}.tar.gz"
          tar -C dist/EmuDrop -czf "dist/$ASSET" .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -l "dist/$ASSET"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The in-app updater shows these notes, so build a real changelog from
          # the commits since the previous tag.
          PREV=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)
          if [ -n "$PREV" ]; then
            git log --pretty=format:'- %s' "${PREV}..${GITHUB_REF_NAME}" > notes.txt
          else
            git log --pretty=format:'- %s' "${GITHUB_REF_NAME}" > notes.txt
          fi
          echo "Changes since ${PREV:-the beginning}:" | cat - notes.txt > changelog.txt
          echo
          head -20 changelog.txt
          gh release create "${GITHUB_REF_NAME}" "dist/${ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "EmuDrop ${GITHUB_REF_NAME}" \
            --notes-file changelog.txt

      - uses: actions/upload-artifact@v4
        with:
          name: emudrop-${{ github.ref_name }}
          path: dist/*.tar.gz
